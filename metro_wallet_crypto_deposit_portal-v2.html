<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metro Wallet — Crypto Deposit & Brokerage Portal</title>
  <style>
    :root {
      --bg: #0b1020;
      --card: #121a30;
      --card-2: #18223f;
      --text: #eef2ff;
      --muted: #9aa7cc;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --warn: #f59e0b;
      --danger: #ef4444;
      --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body {
      margin: 0;
      background: linear-gradient(180deg, #090d1a 0%, var(--bg) 100%);
      color: var(--text);
      padding: 24px 16px;
    }
    .container { max-width: 820px; margin: 0 auto; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }
    .badge {
      background: rgba(59, 130, 246, 0.16);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.35);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
    }
    h1 { margin: 0; font-size: 22px; }
    h2 { margin: 0 0 14px; font-size: 16px; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; margin-top: 12px; }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      font-size: 14px;
    }
    button {
      margin-top: 16px;
      width: 100%;
      padding: 11px 14px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button.secondary { background: #26335c; }
    button.secondary:hover { background: #314174; }
    .result {
      margin-top: 16px;
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      font-size: 13px;
      line-height: 1.5;
      word-break: break-word;
    }
    .status-ok { color: var(--success); font-weight: 700; }
    .status-warn { color: var(--warn); font-weight: 700; }
    .status-err { color: var(--danger); font-weight: 700; }
    a.pay-link {
      display: inline-block;
      margin-top: 10px;
      padding: 9px 14px;
      background: var(--success);
      color: #04130d;
      text-decoration: none;
      font-weight: 700;
      border-radius: 8px;
    }
    .muted { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>Metro Wallet Deposit Portal</h1>
        <div class="muted">Connected to Google Apps Script &amp; NOWPayments</div>
      </div>
      <span class="badge">LIVE BACKEND READY</span>
    </div>

    <div class="grid">
      <!-- Deposit / Invoice Generator -->
      <div class="card">
        <h2>Create Crypto Deposit Invoice</h2>
        <form id="depositForm">
          <label for="clientEmail">Client Email or ID</label>
          <input id="clientEmail" name="clientEmail" type="text" placeholder="client@example.com" required />

          <label for="brokerName">Brokerage / Desk</label>
          <select id="brokerName" name="brokerName">
            <option value="Metro Options">Metro Options</option>
            <option value="Metro Finance">Metro Finance</option>
            <option value="Metro iQ Options">Metro iQ Options</option>
          </select>

          <label for="amountUsd">Deposit Amount (USD)</label>
          <input id="amountUsd" name="amountUsd" type="number" step="0.01" min="1" placeholder="100.00" required />

          <label for="payCurrency">Pay With Currency</label>
          <select id="payCurrency" name="payCurrency">
            <option value="usdttrc20">USDT (TRC20)</option>
            <option value="usdterc20">USDT (ERC20)</option>
            <option value="btc">Bitcoin (BTC)</option>
            <option value="eth">Ethereum (ETH)</option>
            <option value="ltc">Litecoin (LTC)</option>
          </select>

          <button type="submit" id="createInvoiceBtn">Generate Invoice</button>
        </form>
        <div id="invoiceResult" class="result" style="display:none;"></div>
      </div>

      <!-- Wallet & Transaction Lookup -->
      <div class="card">
        <h2>Check Wallet &amp; Deposit Status</h2>
        <form id="lookupForm">
          <label for="lookupQuery">Client Email, Wallet, or Invoice / Payment ID</label>
          <input id="lookupQuery" name="lookupQuery" type="text" placeholder="client@example.com or payment_id" required />

          <button type="submit" class="secondary" id="lookupBtn">Check Status</button>
        </form>
        <div id="lookupResult" class="result" style="display:none;"></div>
      </div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyzM3tcP1dZKfqjQvBqKvn_d0faxXVzMmAo2VTGGv3gBdQDwdcAhN1F3FwbQk2Gj1dI0w/exec";

    const depositForm = document.getElementById("depositForm");
    const invoiceResult = document.getElementById("invoiceResult");
    const createInvoiceBtn = document.getElementById("createInvoiceBtn");

    const lookupForm = document.getElementById("lookupForm");
    const lookupResult = document.getElementById("lookupResult");
    const lookupBtn = document.getElementById("lookupBtn");

    async function callBackend(payload) {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      const text = await response.text();
      try {
        return JSON.parse(text);
      } catch (err) {
        throw new Error("Non-JSON response from Apps Script: " + text.slice(0, 200));
      }
    }

    depositForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      invoiceResult.style.display = "block";
      invoiceResult.innerHTML = `<span class="status-warn">Creating invoice...</span>`;
      createInvoiceBtn.disabled = true;

      const payload = {
        action: "create_invoice",
        client_email: document.getElementById("clientEmail").value.trim(),
        broker: document.getElementById("brokerName").value,
        price_amount: Number(document.getElementById("amountUsd").value),
        price_currency: "usd",
        pay_currency: document.getElementById("payCurrency").value
      };

      try {
        const data = await callBackend(payload);
        if (data.error || data.ok === false) {
          throw new Error(data.error || data.message || "Failed to create invoice");
        }

        const payUrl = data.invoice_url || data.payment_url || "";
        const invoiceId = data.id || data.invoice_id || data.payment_id || "N/A";
        const payAmount = data.pay_amount ? `${data.pay_amount} ${String(data.pay_currency || "").toUpperCase()}` : "";

        invoiceResult.innerHTML = `
          <div class="status-ok">Invoice Ready</div>
          <div><strong>Reference ID:</strong> ${escapeHtml(String(invoiceId))}</div>
          <div><strong>Amount:</strong> $${escapeHtml(String(payload.price_amount))} USD${payAmount ? ` (${escapeHtml(payAmount)})` : ""}</div>
          ${data.pay_address ? `<div><strong>Deposit Address:</strong> ${escapeHtml(String(data.pay_address))}</div>` : ""}
          ${payUrl ? `<a class="pay-link" href="${escapeAttr(payUrl)}" target="_blank" rel="noopener noreferrer">Open NOWPayments Checkout</a>` : ""}
        `;
      } catch (err) {
        invoiceResult.innerHTML = `<div class="status-err">Error: ${escapeHtml(err.message)}</div>`;
      } finally {
        createInvoiceBtn.disabled = false;
      }
    });

    lookupForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      lookupResult.style.display = "block";
      lookupResult.innerHTML = `<span class="status-warn">Checking records...</span>`;
      lookupBtn.disabled = true;

      const queryValue = document.getElementById("lookupQuery").value.trim();

      try {
        const url = `${APPS_SCRIPT_URL}?action=status&query=${encodeURIComponent(queryValue)}`;
        const response = await fetch(url);
        const text = await response.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch {
          data = { raw: text };
        }

        if (data.error || data.ok === false) {
          throw new Error(data.error || data.message || "Lookup failed");
        }

        lookupResult.innerHTML = `
          <div class="status-ok">Status Retrieved</div>
          <pre style="white-space:pre-wrap;margin:8px 0 0;font-size:12px;">${escapeHtml(JSON.stringify(data, null, 2))}</pre>
        `;
      } catch (err) {
        lookupResult.innerHTML = `<div class="status-err">Error: ${escapeHtml(err.message)}</div>`;
      } finally {
        lookupBtn.disabled = false;
      }
    });

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeAttr(str) {
      return String(str).replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
  </script>
</body>
</html>
