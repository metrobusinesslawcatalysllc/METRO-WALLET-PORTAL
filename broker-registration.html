<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Broker Owner Registration Portal</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #0f172a; color: #f8fafc; padding: 24px; }
    .container { max-width: 960px; margin: 0 auto; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    h1, h2, h3 { margin-top: 0; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
    .field { flex: 1; min-width: 200px; margin-bottom: 12px; }
    label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
    input, select { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; font-size: 14px; }
    button { padding: 10px 18px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 14px; }
    .primary { background: #2563eb; color: #fff; }
    .primary:disabled { background: #475569; cursor: not-allowed; }
    .secondary { background: #334155; color: #f8fafc; }
    .banner { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; display: none; }
    .banner-ok { display: block; background: #064e3b; border: 1px solid #10b981; color: #a7f3d0; }
    .banner-err { display: block; background: #7f1d1d; border: 1px solid #ef4444; color: #fecaca; }
    .banner-warn { display: block; background: #78350f; border: 1px solid #f59e0b; color: #fde68a; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }
    .tab.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #334155; }
    th { color: #94a3b8; font-weight: 600; }
    .badge { padding: 2px 8px; border-radius: 999px; font-size: 12px; background: #334155; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Broker Owner Registration Portal</h1>
    <div id="statusBanner" class="banner"></div>

    <div class="card">
      <div class="row">
        <div class="field" style="margin-bottom:0">
          <label>Broker ID</label>
          <input id="brokerIdInput" value="brk_metro_01" />
        </div>
        <button type="button" class="secondary" onclick="syncBrokerData()">Sync Broker</button>
      </div>
      <p id="brokerSummary" style="color:#94a3b8; font-size:13px; margin:12px 0 0;">Loading broker status...</p>
    </div>

    <div class="tabs">
      <button type="button" id="tabMgrBtn" class="tab active" onclick="switchTab('mgr')">Admin Managers</button>
      <button type="button" id="tabSubBtn" class="tab" onclick="switchTab('sub')">Sub-Admins</button>
    </div>

    <!-- ADMIN MANAGERS PANEL -->
    <div id="mgrPanel" class="card">
      <h2>Register Admin Manager</h2>
      <div class="row">
        <div class="field">
          <label>Full Name</label>
          <input id="mgrName" placeholder="e.g. John Doe" />
        </div>
        <div class="field">
          <label>Email Address</label>
          <input id="mgrEmail" type="email" placeholder="manager@metrooptions.com" />
        </div>
        <div class="field">
          <label>Password (min 6 chars)</label>
          <input id="mgrPassword" type="password" placeholder="••••••" />
        </div>
      </div>
      <button type="button" id="mgrSubmitBtn" class="primary" onclick="registerAdminManager()">Create Admin Manager</button>

      <h3 style="margin-top:24px;">Active Admin Managers</h3>
      <table>
        <thead>
          <tr><th>Name</th><th>Email</th><th>ID</th><th>Tenant ID</th></tr>
        </thead>
        <tbody id="mgrTableBody">
          <tr><td colspan="4">Loading...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- SUB-ADMINS PANEL -->
    <div id="subPanel" class="card" style="display:none;">
      <h2>Register Sub-Admin</h2>
      <div class="row">
        <div class="field">
          <label>Assign Under Admin Manager</label>
          <select id="subManagerSelect"></select>
        </div>
        <div class="field">
          <label>Full Name</label>
          <input id="subName" placeholder="e.g. Jane Smith" />
        </div>
        <div class="field">
          <label>Email Address</label>
          <input id="subEmail" type="email" placeholder="subadmin@metrooptions.com" />
        </div>
        <div class="field">
          <label>Password (min 6 chars)</label>
          <input id="subPassword" type="password" placeholder="••••••" />
        </div>
      </div>
      <button type="button" id="subSubmitBtn" class="primary" onclick="registerSubAdmin()">Create Sub-Admin</button>

      <h3 style="margin-top:24px;">Active Sub-Admins</h3>
      <table>
        <thead>
          <tr><th>Name</th><th>Email</th><th>Manager ID</th><th>Tenant ID</th></tr>
        </thead>
        <tbody id="subTableBody">
          <tr><td colspan="4">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const API_BASE = "https://metro-wallet-api.metrobusinesscatalystllc.workers.dev";
    let state = {
      broker: null,
      users: [],
      registrationEnabled: false,
      maxManagers: 50,
      maxSubadminsPerManager: 15
    };

    const $ = (id) => document.getElementById(id);

    function showBanner(type, msg) {
      const el = $("statusBanner");
      el.className = "banner " + (type === "ok" ? "banner-ok" : type === "err" ? "banner-err" : "banner-warn");
      el.textContent = msg;
    }

    function switchTab(tab) {
      $("mgrPanel").style.display = tab === "mgr" ? "block" : "none";
      $("subPanel").style.display = tab === "sub" ? "block" : "none";
      $("tabMgrBtn").classList.toggle("active", tab === "mgr");
      $("tabSubBtn").classList.toggle("active", tab === "sub");
    }

    function generateId(prefix) {
      return prefix + "_" + Math.random().toString(36).slice(2, 10);
    }

 function escapeHtml(str) {
  return String(str || "").replace(/[&<>"']/g, function (c) {
    return {
      "&": "&",
      "<": "<",
      ">": ">",
      '"': """,
      "'": "'"
    }[c] || c;
  });
}

    async function syncBrokerData() {
      const brokerId = $("brokerIdInput").value.trim();
      if (!brokerId) return showBanner("err", "Please enter a Broker ID.");

      try {
        const res = await fetch(`${API_BASE}/api/sync?broker_id=${encodeURIComponent(brokerId)}`);
        const data = await res.json();
        if (!res.ok || data.ok === false) {
          throw new Error(data.error || "Sync failed");
        }

        const broker = Array.isArray(data.brokers) ? data.brokers[0] : data.broker;
        if (!broker) {
          showBanner("err", `Broker '${brokerId}' not found.`);
          return;
        }

        state.broker = broker;
        state.users = Array.isArray(data.users) ? data.users : [];
        state.registrationEnabled = Number(broker.registration_enabled) === 1;
        state.maxManagers = Number(broker.max_admin_managers || 50);
        state.maxSubadminsPerManager = Number(broker.max_subadmins_per_manager || 15);

        $("mgrSubmitBtn").disabled = !state.registrationEnabled;
        $("subSubmitBtn").disabled = !state.registrationEnabled;

        $("brokerSummary").textContent =
          `Broker: ${broker.name || broker.id} | Registration: ${state.registrationEnabled ? "UNLOCKED" : "LOCKED"} | Caps: ${state.maxManagers} Managers / ${state.maxSubadminsPerManager} Sub-Admins per Manager`;

        if (!state.registrationEnabled) {
          showBanner("warn", "Registration is locked for this broker (registration_enabled = 0).");
        }

        renderTables();
      } catch (err) {
        showBanner("err", "Sync error: " + err.message);
      }
    }

    function renderTables() {
      const managers = state.users.filter((u) => u.role === "admin_manager");
      const subadmins = state.users.filter((u) => u.role === "sub_admin");

      $("mgrTableBody").innerHTML = managers.length
        ? managers.map((m) => `
            <tr>
              <td>${escapeHtml(m.name)}</td>
              <td>${escapeHtml(m.email)}</td>
              <td><span class="badge">${escapeHtml(m.id)}</span></td>
              <td>${escapeHtml(m.tenant_id || "-")}</td>
            </tr>`).join("")
        : `<tr><td colspan="4">No Admin Managers created yet.</td></tr>`;

      $("subManagerSelect").innerHTML = managers.length
        ? managers.map((m) => `<option value="${escapeHtml(m.id)}" data-tenant="${escapeHtml(m.tenant_id || "")}">${escapeHtml(m.name)} (${escapeHtml(m.id)})</option>`).join("")
        : `<option value="">Create an Admin Manager first</option>`;

      $("subTableBody").innerHTML = subadmins.length
        ? subadmins.map((s) => `
            <tr>
              <td>${escapeHtml(s.name)}</td>
              <td>${escapeHtml(s.email)}</td>
              <td>${escapeHtml(s.manager_id || "-")}</td>
              <td>${escapeHtml(s.tenant_id || "-")}</td>
            </tr>`).join("")
        : `<tr><td colspan="4">No Sub-Admins created yet.</td></tr>`;
    }

    async function registerAdminManager() {
      const brokerId = $("brokerIdInput").value.trim();
      const name = $("mgrName").value.trim();
      const email = $("mgrEmail").value.trim();
      const password = $("mgrPassword").value;

      if (!name || !email || password.length < 6) {
        return showBanner("err", "Enter Full Name, Email, and a Password (at least 6 characters).");
      }

      const btn = $("mgrSubmitBtn");
      btn.disabled = true;
      btn.textContent = "Creating...";

      try {
        const managerId = generateId("mgr");
        const tenantId = generateId("ten");
        const payload = {
          targetType: "user",
          id: managerId,
          broker_id: brokerId,
          role: "admin_manager",
          name,
          email,
          password,
          tenant_id: tenantId,
          status: "active"
        };

        const res = await fetch(`${API_BASE}/api/upsert`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (!res.ok || data.ok === false) {
          throw new Error(data.error || `Server returned ${res.status}`);
        }

        $("mgrName").value = "";
        $("mgrEmail").value = "";
        $("mgrPassword").value = "";
        showBanner("ok", `Admin Manager '${name}' created! ID: ${managerId}`);
        await syncBrokerData();
      } catch (err) {
        showBanner("err", "Failed to create Admin Manager: " + err.message);
      } finally {
        btn.disabled = !state.registrationEnabled;
        btn.textContent = "Create Admin Manager";
      }
    }

    async function registerSubAdmin() {
      const brokerId = $("brokerIdInput").value.trim();
      const sel = $("subManagerSelect");
      const managerId = sel.value;
      const tenantId = sel.options[sel.selectedIndex]?.dataset?.tenant || generateId("ten");
      const name = $("subName").value.trim();
      const email = $("subEmail").value.trim();
      const password = $("subPassword").value;

      if (!managerId) return showBanner("err", "Select an Admin Manager first.");
      if (!name || !email || password.length < 6) {
        return showBanner("err", "Enter Full Name, Email, and a Password (at least 6 characters).");
      }

      const btn = $("subSubmitBtn");
      btn.disabled = true;
      btn.textContent = "Creating...";

      try {
        const subId = generateId("sub");
        const payload = {
          targetType: "user",
          id: subId,
          broker_id: brokerId,
          role: "sub_admin",
          manager_id: managerId,
          tenant_id: tenantId,
          name,
          email,
          password,
          status: "active"
        };

        const res = await fetch(`${API_BASE}/api/upsert`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (!res.ok || data.ok === false) {
          throw new Error(data.error || `Server returned ${res.status}`);
        }

        $("subName").value = "";
        $("subEmail").value = "";
        $("subPassword").value = "";
        showBanner("ok", `Sub-Admin '${name}' created under ${managerId}!`);
        await syncBrokerData();
      } catch (err) {
        showBanner("err", "Failed to create Sub-Admin: " + err.message);
      } finally {
        btn.disabled = !state.registrationEnabled;
        btn.textContent = "Create Sub-Admin";
      }
    }

    syncBrokerData();
  </script>
</body>
</html>
